name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter blockprint test
      - run: pnpm -r typecheck
      - run: pnpm --filter blockprint build
      - run: pnpm --filter demo build

      # Packaging smoke test: the published artifact must import in BARE Node
      # (no bundler), and blockprint/config must work without React installed.
      # Guards against the 0.1.1 regression (extensionless ESM imports).
      - name: Smoke-test packed tarball
        run: |
          cd packages/blockprint
          if grep -rEq '(from\s+"|import\(")\.\.?/[^"]+\.tsx?"' dist/*.d.ts; then
            echo 'declaration files contain raw .ts/.tsx specifiers' && exit 1
          fi
          if ls dist | grep -Eq 'chunk|\.map$'; then
            echo 'dist contains stale build artifacts' && exit 1
          fi
          pnpm pack
          TARBALL=$PWD/$(ls blockprint-*.tgz)

          mkdir -p /tmp/smoke-main && cd /tmp/smoke-main
          npm init -y >/dev/null
          npm i "$TARBALL" react react-dom --silent
          node --input-type=module -e "
            const m = await import('blockprint');
            if (typeof m.createRegistry !== 'function') throw new Error('createRegistry missing');
            if (typeof m.Renderer !== 'function') throw new Error('Renderer missing');
            console.log('main entry: ok');
          "
          # The main entry must stay loadable from React Server Components —
          # the react-server build exports no Component class (0.3.0 regression).
          node --conditions=react-server --input-type=module -e "
            await import('blockprint');
            console.log('react-server load: ok');
          "

          mkdir -p /tmp/smoke-server && cd /tmp/smoke-server
          npm init -y >/dev/null
          npm i "$TARBALL" --silent --legacy-peer-deps
          if ls node_modules | grep -q '^react$'; then
            echo 'react must not be required for blockprint/config' && exit 1
          fi
          node --input-type=module -e "
            const { parseConfig, ConfigError, defineBlock, validateConfig } = await import('blockprint/config');
            const out = parseConfig([{ type: 'hero' }]);
            if (out[0].type !== 'hero') throw new Error('parseConfig broken');
            try { parseConfig({}); throw new Error('should have thrown'); }
            catch (e) { if (!(e instanceof ConfigError)) throw e; }
            const m = { hero: defineBlock({ schema: { '~standard': { version: 1, vendor: 't', validate: (v) => ({ value: v }) } } }) };
            const report = validateConfig(m, [{ type: 'hero' }, { type: 'nope' }]);
            if (!report.ok || report.unknownTypes[0] !== 'nope') throw new Error('validateConfig broken');
            console.log('config entry (no react): ok');
          "
          # blockprint/config must TYPECHECK without @types/react installed,
          # with skipLibCheck off and exactOptionalPropertyTypes on.
          npm i typescript --silent
          cat > check.ts <<'TS'
          import { defineBlock, validateConfig, parseConfig } from "blockprint/config";
          import type { StandardSchemaV1, InputOf, OutputOf } from "blockprint/config";
          const schema: StandardSchemaV1<{ t?: string }, { t: string }> = {
            "~standard": { version: 1, vendor: "t", validate: (v) => ({ value: v as { t: string } }) },
          };
          const hero = defineBlock({ schema, defaults: {}, summary: (p) => p.t });
          const input: InputOf<typeof hero> = {};
          const output: OutputOf<typeof hero> = { t: "x" };
          const report = validateConfig({ hero }, [{ type: "hero", props: {} }]);
          if (!report.ok) parseConfig([]);
          export { input, output };
          TS
          npx tsc --strict --exactOptionalPropertyTypes --module nodenext --moduleResolution nodenext --target es2022 --noEmit check.ts
          echo 'config typecheck (no @types/react): ok'
